name: NPM Publish on Release

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate with Verdaccio
        run: echo "//18.195.169.73:4873/:_authToken=${VERDACCIO_TOKEN}" >> ~/.npmrc
        env:
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      - name: Publish to Verdaccio
        run: npm publish
